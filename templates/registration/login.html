{% extends 'detection/base.html' %}

{% block title %}Admin Security Login | Suspicious Activity Detection System{% endblock %}

{% block content %}
<div class="login-container">
    <div class="glass-card login-card text-center">
        <div class="stat-icon primary mx-auto mb-3" style="width: 60px; height: 60px; font-size: 1.8rem;">
            <i class="fa-solid fa-user-lock"></i>
        </div>
        
        <h2 class="font-heading mb-1 text-white">Security Portal</h2>
        <p class="text-secondary small mb-4">Suspicious Activity Detection System Using CNN</p>

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}

            <div class="mb-3 text-start">
                <label class="form-label text-muted small text-uppercase font-mono">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-secondary"><i class="fa-solid fa-user"></i></span>
                    <input type="text" name="username" class="form-control security-input" placeholder="Enter username" required id="id_username">
                </div>
            </div>

            <div class="mb-4 text-start">
                <label class="form-label text-muted small text-uppercase font-mono">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-secondary"><i class="fa-solid fa-key"></i></span>
                    <input type="password" name="password" class="form-control security-input" placeholder="Enter password" required id="id_password">
                </div>
            </div>

            <button type="submit" class="btn btn-cyber w-100 py-2.5 justify-content-center">
                <i class="fa-solid fa-right-to-bracket me-2"></i> Authenticate & Login
            </button>
        </form>

        <div class="mt-4 pt-3 border-top border-secondary">
            <span class="text-muted small d-block mb-2 font-mono">Quick Admin Credentials:</span>
            <button class="btn btn-sm btn-outline-cyber me-2 font-mono" onclick="fillAdminCredentials('admin', 'admin123')">
                <i class="fa-solid fa-shield-halved me-1"></i> Quick Fill Admin
            </button>
        </div>
    </div>
</div>

<script>
function fillAdminCredentials(u, p) {
    document.getElementById('id_username').value = u;
    document.getElementById('id_password').value = p;
}
</script>
{% endblock %}
